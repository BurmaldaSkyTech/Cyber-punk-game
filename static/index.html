<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberpunk RED</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e5; margin: 0; padding: 20px; }
  .container { max-width: 900px; margin: 0 auto; }
  h1 { color: #ff2a6d; text-shadow: 0 0 10px #ff2a6d; }
  .log { background: #12121a; border: 1px solid #333; border-radius: 8px; padding: 15px; min-height: 300px; margin-bottom: 15px; overflow-y: auto; max-height: 60vh; }
  .entry { margin-bottom: 12px; padding: 10px; border-left: 3px solid #05d9e8; background: #1a1a25; white-space: pre-wrap; }
  .entry.mech { border-left-color: #ff2a6d; font-family: monospace; font-size: 0.9em; }
  .entry.narr { border-left-color: #05d9e8; }
  .entry.rate { border-left-color: #ffd700; background: #1f1f15; }
  .turnbar { background: #1a1a25; border: 1px solid #05d9e8; border-radius: 8px; padding: 10px 15px; margin-bottom: 10px; font-size: 1.1em; }
  .turnbar b { color: #05d9e8; }
  input, textarea { background: #1a1a25; color: #e0e0e5; border: 1px solid #444; padding: 10px; border-radius: 4px; width: 100%; box-sizing: border-box; }
  button { background: #ff2a6d; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 1em; }
  button:hover { background: #d91e56; }
  button:disabled { background: #555; cursor: not-allowed; }
  button.secondary { background: #333; }
  button.secondary:hover { background: #555; }
  .setup { background: #12121a; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row input { flex: 1; }
  .rating { display: flex; gap: 5px; margin-top: 10px; }
  .star { cursor: pointer; font-size: 1.5em; color: #444; }
  .star.active { color: #ffd700; }
  .hidden { display: none; }
  .err { color: #ff2a6d; margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <h1>CYBERPUNK RED</h1>

  <div class="setup" id="setup">
    <h2>Новая сессия</h2>
    <div class="row">
      <input id="name" placeholder="Имя игрока" value="Игрок">
    </div>
    <div class="row">
      <button onclick="start()">Быстрый старт (прегены)</button>
      <button class="secondary" onclick="location.href='/setup'">Создать персонажей по правилам →</button>
    </div>
  </div>

  <div id="game" class="hidden">
    <div class="turnbar">Сейчас ходит: <b id="turnwho">—</b></div>
    <div class="log" id="log"></div>
    <div class="row">
      <input id="action" placeholder="Действие текущего ходящего..." onkeydown="if(event.key==='Enter')send()">
      <button id="sendbtn" onclick="send()">Отправить</button>
    </div>
    <div class="err" id="err"></div>

    <div id="rating" class="entry rate hidden">
      <strong>Оцени нарратив:</strong>
      <div class="rating" id="stars">
        <span class="star" data-v="1">★</span>
        <span class="star" data-v="2">★</span>
        <span class="star" data-v="3">★</span>
        <span class="star" data-v="4">★</span>
        <span class="star" data-v="5">★</span>
      </div>
      <textarea id="edited" rows="3" placeholder="Если оценка <= 3 — напиши свой вариант (необязательно)" class="hidden"></textarea>
      <button onclick="saveRate()" style="margin-top:10px">Сохранить</button>
    </div>
  </div>
</div>

<script>
let sid = null;
let lastTurnId = null;
let currentPlayer = '';
let busy = false;

const PREGENS = [
  {name:"Вектор", role:"Solo",
   stats:{INT:3,REF:7,DEX:4,TECH:3,COOL:5,WILL:4,LUCK:2,MOVE:5,BODY:6,EMP:3},
   skills:{handgun:4,melee:3,evasion:3,athletics:3,perception:3},
   hp:12,max_hp:12,wound:"unharmed",dsp:0,dead:false,armor:"light_armorjack"},
  {name:"Никс", role:"Netrunner",
   stats:{INT:6,REF:4,DEX:3,TECH:5,COOL:4,WILL:4,LUCK:3,MOVE:4,BODY:4,EMP:4},
   skills:{interface:4,programming:3,stealth:3,persuasion:3,perception:2},
   hp:8,max_hp:8,wound:"unharmed",dsp:0,dead:false,armor:"leathers"}
];

const SCENARIO = {
  scene: "Бар 'Ржавый болт', Ночной Город, 23:40. За угловым столом среди дыма и неоновых бликов сидит фиксер Кесслер. За барной стойкой — два его телохранителя в кевларе с тяжёлыми пистолетами под плащами. На столе у Кесслера — стакан синтетического виски и дата-планшет с контрактом.",
  heat: 1, clocks: {},
  npcs: [
    {id:"kessler", name:"Фиксер Кесслер", hp:15, max_hp:15, wound:"unharmed", armor:"leathers"},
    {id:"guard1", name:"Телохранитель Кесслера 1", hp:24, max_hp:24, wound:"unharmed", armor:"kevlar"},
    {id:"guard2", name:"Телохранитель Кесслера 2", hp:24, max_hp:24, wound:"unharmed", armor:"kevlar"}
  ]
};

function showSceneIntro(state) {
  const scene = state.scenario?.scene || '';
  if (scene) {
    addLog(`[СЦЕНА]\n${scene}`, 'narr');
  }
  const npcs = state.npcs || [];
  if (npcs.length > 0) {
    const npcList = npcs.map(n => `• ${n.name} (HP ${n.hp}/${n.max_hp}, ${n.wound || 'unharmed'}, броня: ${n.armor || 'нет'})`).join('\n');
    addLog(`[В СЦЕНЕ]\n${npcList}`, 'mech');
  }
  // Выводим игроков
  const players = state.players || [];
  if (players.length > 0) {
    const pl = players.map(p => `• ${p.name} [${p.role}] HP ${p.hp}/${p.max_hp}`).join('\n');
    addLog(`[ПЕРСОНАЖИ]\n${pl}`, 'mech');
  }
}

async function enterGame(sessionId, state) {
  sid = sessionId;
  localStorage.setItem('sid', sid);
  document.getElementById('setup').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('log').innerHTML = '';
  currentPlayer = state.order[state.turn];
  setTurn();
  addLog(`Сессия ${sid}. Ходит: ${currentPlayer}`, 'mech');
  showSceneIntro(state);
}

async function start() {
  const name = document.getElementById('name').value.trim() || 'Игрок';
  const players = PREGENS.map(p => Object.assign({}, p, {name: p.name === 'Вектор' ? name : p.name}));
  const r = await fetch('/session', {method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({players, scenario: SCENARIO})});
  const d = await r.json();
  await enterGame(d.id, d.state);
}

async function send() {
  if (busy || !sid) return;
  const action = document.getElementById('action').value.trim();
  if (!action) return;
  busy = true;
  document.getElementById('sendbtn').disabled = true;
  document.getElementById('err').textContent = '';
  document.getElementById('action').value = '';
  addLog(`${currentPlayer}: ${action}`, 'mech');
  try {
    const r = await fetch(`/session/${sid}/action`, {method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({player: currentPlayer, text: action})});
    if (!r.ok) { const e = await r.json().catch(()=>({})); throw new Error(e.detail || `HTTP ${r.status}`); }
    const d = await r.json();
    if (d.mechanics) {
      const m = d.mechanics;
      if (m.no_roll) { addLog(`[без броска] свободное действие`, 'mech'); }
      else { addLog(`[механика] ${m.action_type} | ${m.stat_key}+${m.skill}: ${m.total} vs DV${m.dv} -> ${m.success?'УСПЕХ':'ПРОВАЛ'}`, 'mech'); }
      if (m.damage != null) addLog(`цель ${m.target}: урон ${m.damage} - SP${m.armor_sp} = ${m.net_damage}`, 'mech');
      if (m.npc_reaction) { const nr=m.npc_reaction; addLog(`[ответ NPC] ${nr.npc}: ${nr.success?'попадание':'промах'}, урон по игроку ${nr.net_damage||0}`, 'mech'); }
    }
    addLog(d.narration, 'narr');
    lastTurnId = d.turn_id;
    currentPlayer = d.next_player;
    setTurn();
    if (lastTurnId) { document.getElementById('rating').classList.remove('hidden'); resetStars(); }
  } catch (e) {
    document.getElementById('err').textContent = 'Ошибка: ' + e.message;
  } finally {
    busy = false;
    document.getElementById('sendbtn').disabled = false;
  }
}

function setTurn() {
  document.getElementById('turnwho').textContent = currentPlayer;
  document.getElementById('action').placeholder = `Действие для: ${currentPlayer}`;
}

function addLog(text, cls) {
  const el = document.createElement('div');
  el.className = 'entry ' + cls;
  el.textContent = text;
  document.getElementById('log').appendChild(el);
  document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
}

let selectedRating = 0;
document.querySelectorAll('.star').forEach(s => {
  s.onclick = () => {
    selectedRating = parseInt(s.dataset.v);
    document.querySelectorAll('.star').forEach(x => x.classList.remove('active'));
    for (let i=1; i<=selectedRating; i++) document.querySelector(`.star[data-v="${i}"]`).classList.add('active');
    document.getElementById('edited').classList.toggle('hidden', selectedRating > 3);
  };
});
function resetStars() {
  selectedRating = 0;
  document.querySelectorAll('.star').forEach(x => x.classList.remove('active'));
  document.getElementById('edited').classList.add('hidden');
  document.getElementById('edited').value = '';
}
async function saveRate() {
  if (!selectedRating || !lastTurnId) return;
  const edited = document.getElementById('edited').value.trim() || null;
  await fetch(`/session/${sid}/turn/${lastTurnId}/rate`, {method:'POST',
    headers:{'Content-Type':'application/json'}, body: JSON.stringify({rating: selectedRating, edited})});
  document.getElementById('rating').classList.add('hidden');
  resetStars();
}

// === ВОССТАНОВЛЕНИЕ СЕССИИ ПРИ ЗАГРУЗКЕ ===
window.addEventListener('load', async () => {
  const params = new URLSearchParams(window.location.search);
  const urlSid = params.get('sid');
  const storedSid = urlSid || localStorage.getItem('sid');
  if (!storedSid) return;
  try {
    const r = await fetch(`/session/${storedSid}`);
    if (!r.ok) { localStorage.removeItem('sid'); return; }
    const st = await r.json();
    await enterGame(storedSid, st);
    // showSceneIntro уже вызывается внутри enterGame
  } catch (e) {
    localStorage.removeItem('sid');
  }
});
</script>
</body>
</html>
