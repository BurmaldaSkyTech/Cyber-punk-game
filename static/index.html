<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cyberpunk RED</title>
<style>
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: #e0e0e5; margin: 0; padding: 20px; }
  .container { max-width: 1700px; margin: 0 auto; }
  h1 { color: #ff2a6d; text-shadow: 0 0 10px #ff2a6d; }

  /* === ЭКРАН ЛОББИ === */
  .lobby-screen { max-width: 600px; margin: 40px auto; }
  .lobby-box { background: #12121a; border: 1px solid #333; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
  .lobby-box h2 { color: #05d9e8; margin-top: 0; }
  .lobby-input { width: 100%; padding: 12px; background: #1a1a25; color: #fff; border: 1px solid #444; border-radius: 4px; font-size: 1.1em; margin-bottom: 10px; box-sizing: border-box; }
  .code-display { font-family: monospace; font-size: 2em; text-align: center; padding: 20px; background: #1a2a1a; border: 2px solid #0f0; border-radius: 8px; margin: 15px 0; letter-spacing: 8px; }
  .player-list { list-style: none; padding: 0; }
  .player-list li { padding: 10px; background: #1a1a25; border-radius: 4px; margin-bottom: 6px; border-left: 3px solid #05d9e8; }
  .player-list li.host { border-left-color: #ff2a6d; }

  /* === ИГРОВАЯ РАСКЛАДКА === */
  .game-layout { display: grid; grid-template-columns: 300px 1fr 300px; gap: 15px; align-items: start; }
  .sidebar { display: flex; flex-direction: column; gap: 12px; position: sticky; top: 20px; max-height: calc(100vh - 40px); overflow-y: auto; padding-right: 4px; }
  .sidebar::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }

  .char-panel { background: #12121a; border: 1px solid #333; border-radius: 8px; padding: 12px; }
  .char-panel.active-turn { border: 2px solid #ff2a6d; box-shadow: 0 0 12px rgba(255,42,109,0.35); }
  .char-panel.dead { opacity: 0.5; }
  .char-panel h3 { color: #05d9e8; margin: 0 0 8px 0; font-size: 1.05em; }
  .char-panel h3 .role { color: #888; font-weight: normal; font-size: 0.85em; }
  .hp-bar { height: 10px; background: #2a2a35; border-radius: 5px; overflow: hidden; margin: 4px 0; }
  .hp-fill { height: 100%; transition: width 0.3s; }
  .panel-row { font-size: 0.9em; margin: 3px 0; }
  .panel-row b { color: #05d9e8; }
  .panel-section { color: #ff2a6d; font-size: 0.75em; text-transform: uppercase; letter-spacing: 1px; margin: 10px 0 4px 0; border-bottom: 1px solid #333; padding-bottom: 2px; }
  .panel-small { font-size: 0.82em; color: #bbb; line-height: 1.5; word-break: break-word; }
  .stat-chip { display: inline-block; background: #1a1a25; border: 1px solid #333; border-radius: 4px; padding: 2px 6px; margin: 2px; font-size: 0.78em; }
  .stat-chip b { color: #05d9e8; }

  .log { background: #12121a; border: 1px solid #333; border-radius: 8px; padding: 15px; min-height: 300px; margin-bottom: 15px; overflow-y: auto; max-height: 68vh; }
  .entry { margin-bottom: 12px; padding: 10px; border-left: 3px solid #05d9e8; background: #1a1a25; white-space: pre-wrap; }
  .entry.mech { border-left-color: #ff2a6d; font-family: monospace; font-size: 0.9em; }
  .entry.narr { border-left-color: #05d9e8; }
  .turnbar { background: #1a1a25; border: 1px solid #05d9e8; border-radius: 8px; padding: 10px 15px; margin-bottom: 10px; font-size: 1.1em; }
  .turnbar b { color: #05d9e8; }
  input, textarea { background: #1a1a25; color: #e0e0e5; border: 1px solid #444; padding: 10px; border-radius: 4px; width: 100%; box-sizing: border-box; }
  button { background: #ff2a6d; color: white; border: none; padding: 12px 24px; border-radius: 4px; cursor: pointer; font-size: 1em; }
  button:hover { background: #d91e56; }
  button:disabled { background: #555; cursor: not-allowed; }
  button.secondary { background: #333; }
  button.secondary:hover { background: #555; }
  .row { display: flex; gap: 10px; margin-top: 10px; }
  .row input { flex: 1; }
  .err { color: #ff2a6d; margin-top: 8px; }
  .hidden { display: none; }

  @media (max-width: 1100px) {
    .game-layout { grid-template-columns: 1fr; }
    .sidebar { position: static; max-height: none; }
  }
</style>
</head>
<body>
<div class="container">
  <h1>CYBERPUNK RED</h1>

  <!-- === ЭКРАН ЛОББИ === -->
  <div id="lobby">
    <div class="lobby-screen">
      <div class="lobby-box">
        <h2>Создать комнату</h2>
        <input class="lobby-input" id="host-name" placeholder="Ваше имя">
        <button onclick="createRoom()">Создать</button>
        <div class="err hidden" id="host-err"></div>
      </div>

      <div class="lobby-box">
        <h2>Войти по коду</h2>
        <input class="lobby-input" id="join-code" placeholder="Код комнаты (например: K7X2QF)">
        <input class="lobby-input" id="join-name" placeholder="Ваше имя">
        <button onclick="joinRoom()">Войти</button>
        <div class="err hidden" id="join-err"></div>
      </div>

      <div class="lobby-box hidden" id="waiting-box">
        <h2>Ожидание игроков</h2>
        <div class="code-display" id="room-code"></div>
        <p style="text-align:center;color:#888">Отправьте этот код другим игрокам</p>
        <ul class="player-list" id="waiting-players"></ul>
        <button onclick="startGame()" id="start-btn" class="hidden">Начать игру ▶</button>
      </div>
    </div>
  </div>

  <!-- === ИГРОВОЙ ЭКРАН === -->
  <div id="game" class="hidden">
    <div class="turnbar">Сейчас ходит: <b id="turnwho">—</b></div>
    <div class="game-layout">
      <div class="sidebar" id="panel-left"></div>
      <div class="center-col">
        <div class="log" id="log"></div>
        <div class="row">
          <input id="action" placeholder="Действие..." onkeydown="if(event.key==='Enter')send()">
          <button id="sendbtn" onclick="send()">Отправить</button>
        </div>
        <div class="err" id="err"></div>
      </div>
      <div class="sidebar" id="panel-right"></div>
    </div>
  </div>
</div>

<script>
let sid = null;
let token = null;
let myName = null;
let isHost = false;
let ws = null;
let currentState = null;

// ============ ЛОББИ ============

async function createRoom() {
  const name = document.getElementById('host-name').value.trim();
  if (!name) return alert('Введите имя');
  
  // Создаём случайного персонажа
  const r = await fetch('/chargen', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
  const char = await r.json();
  char.name = name;
  
  const resp = await fetch('/lobby/create', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({player_name: name, character: char})});
  
  if (!resp.ok) {
    const e = await resp.json();
    document.getElementById('host-err').textContent = e.detail || 'Ошибка';
    document.getElementById('host-err').classList.remove('hidden');
    return;
  }
  
  const data = await resp.json();
  sid = data.sid;
  token = data.token;
  myName = name;
  isHost = true;
  currentState = data.state;
  
  document.getElementById('room-code').textContent = data.code;
  document.getElementById('waiting-box').classList.remove('hidden');
  document.getElementById('start-btn').classList.remove('hidden');
  updateWaitingList();
  connectWS();
}

async function joinRoom() {
  const code = document.getElementById('join-code').value.trim().toUpperCase();
  const name = document.getElementById('join-name').value.trim();
  if (!code || !name) return alert('Введите код и имя');
  
  const r = await fetch('/chargen', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: '{}'});
  const char = await r.json();
  char.name = name;
  
  const resp = await fetch('/lobby/join', {method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({code, player_name: name, character: char})});
  
  if (!resp.ok) {
    const e = await resp.json();
    document.getElementById('join-err').textContent = e.detail || 'Ошибка';
    document.getElementById('join-err').classList.remove('hidden');
    return;
  }
  
  const data = await resp.json();
  sid = data.sid;
  token = data.token;
  myName = name;
  isHost = false;
  currentState = data.state;
  
  document.getElementById('waiting-box').classList.remove('hidden');
  document.getElementById('room-code').textContent = code;
  updateWaitingList();
  connectWS();
}

function updateWaitingList() {
  const list = document.getElementById('waiting-players');
  list.innerHTML = '';
  for (let i = 0; i < currentState.players.length; i++) {
    const p = currentState.players[i];
    const li = document.createElement('li');
    li.className = i === 0 ? 'host' : '';
    li.textContent = p.name + ' [' + p.role + ']' + (i === 0 ? ' (хост)' : '');
    list.appendChild(li);
  }
}

async function startGame() {
  const resp = await fetch(`/lobby/${sid}/start?token=${token}`, {method: 'POST'});
  if (!resp.ok) {
    const e = await resp.json();
    alert(e.detail || 'Ошибка');
  }
}

// ============ WEBSOCKET ============

function connectWS() {
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/ws/${sid}?player=${encodeURIComponent(myName)}&token=${token}`);
  
  ws.onmessage = (e) => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') {
      currentState = msg.state;
      if (currentState.status === 'playing') {
        enterGame();
      } else {
        updateWaitingList();
      }
    }
  };
  
  ws.onclose = () => {
    console.log('WS закрыт');
  };
}

// ============ ИГРА ============

function enterGame() {
  document.getElementById('lobby').classList.add('hidden');
  document.getElementById('game').classList.remove('hidden');
  document.getElementById('log').innerHTML = '';
  showSceneIntro();
  renderPanels();
}

function showSceneIntro() {
  const scene = currentState.scenario?.scene || '';
  if (scene) addLog(`[СЦЕНА]\n${scene}`, 'narr');
}

function hpColor(pct) {
  if (pct > 50) return '#0f0';
  if (pct > 25) return '#ff0';
  return '#f00';
}

function buildCharPanel(p, isActive) {
  const div = document.createElement('div');
  div.className = 'char-panel' + (isActive ? ' active-turn' : '') + (p.dead ? ' dead' : '');
  const maxHp = p.max_hp || 1;
  const hpPct = Math.max(0, Math.min(100, Math.round((p.hp || 0) / maxHp * 100)));
  const stats = Object.entries(p.stats || {}).map(([k, v]) => `<span class="stat-chip"><b>${k}</b> ${v}</span>`).join('');
  const skills = Object.entries(p.skills || {}).sort((a, b) => b[1] - a[1]).map(([k, v]) => `${k} +${v}`).join(', ') || '—';
  const inv = (p.inventory || []).join(', ') || '—';
  const cyber = (p.cyberware || []).join(', ') || '—';
  
  div.innerHTML = `
    <h3>${p.name} <span class="role">[${p.role}]</span>${p.dead ? ' ☠' : ''}</h3>
    <div class="hp-bar"><div class="hp-fill" style="width:${hpPct}%;background:${hpColor(hpPct)}"></div></div>
    <div class="panel-row" style="color:#888;font-size:0.82em">HP ${p.hp}/${p.max_hp} • ${p.wound || 'unharmed'}</div>
    <div class="panel-row"><b>EB:</b> ${p.eb ?? 0} &nbsp; <b>Человечность:</b> ${p.humanity ?? '—'}</div>
    <div class="panel-row"><b>Оружие:</b> ${p.weapon || '—'}</div>
    <div class="panel-row"><b>Броня:</b> ${p.armor || '—'}</div>
    <div class="panel-section">Характеристики</div>
    <div class="panel-small">${stats}</div>
    <div class="panel-section">Навыки</div>
    <div class="panel-small">${skills}</div>
    <div class="panel-section">Импланты</div>
    <div class="panel-small">${cyber}</div>
    <div class="panel-section">Инвентарь</div>
    <div class="panel-small">${inv}</div>
  `;
  return div;
}

function buildNpcPanel() {
  const div = document.createElement('div');
  div.className = 'char-panel';
  const npcs = (currentState.npcs || []).map(n => {
    const maxHp = n.max_hp || 1;
    const pct = Math.max(0, Math.min(100, Math.round((n.hp || 0) / maxHp * 100)));
    return `<div style="margin-bottom:10px">
      <div style="font-size:0.95em">${n.name}${n.dead ? ' ☠' : ''}</div>
      <div class="hp-bar"><div class="hp-fill" style="width:${pct}%;background:${hpColor(pct)}"></div></div>
      <div style="font-size:0.78em;color:#888">HP ${n.hp}/${n.max_hp} • ${n.wound || 'unharmed'} • броня: ${n.armor || 'нет'}</div>
    </div>`;
  }).join('');
  div.innerHTML = `<h3 style="color:#ff2a6d">NPC в сцене</h3>${npcs || '<div class="panel-small">Никого</div>'}`;
  return div;
}

function renderPanels() {
  const left = document.getElementById('panel-left');
  const right = document.getElementById('panel-right');
  left.innerHTML = '';
  right.innerHTML = '';
  
  const activeName = (currentState.order || [])[currentState.turn ?? 0];
  const players = currentState.players || [];
  
  players.forEach((p, i) => {
    const panel = buildCharPanel(p, p.name === activeName);
    if (i % 2 === 0) left.appendChild(panel);
    else right.appendChild(panel);
  });
  
  right.appendChild(buildNpcPanel());
}

async function send() {
  const action = document.getElementById('action').value.trim();
  if (!action) return;
  
  document.getElementById('action').value = '';
  document.getElementById('sendbtn').disabled = true;
  document.getElementById('err').textContent = '';
  
  addLog(`${myName}: ${action}`, 'mech');
  
  try {
    const r = await fetch(`/session/${sid}/action`, {method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({player: myName, text: action, token: token})});
    
    if (!r.ok) {
      const e = await r.json().catch(() => ({}));
      throw new Error(e.detail || `HTTP ${r.status}`);
    }
    
    const d = await r.json();
    if (d.mechanics) {
      const m = d.mechanics;
      if (m.no_roll) addLog(`[без броска] свободное действие`, 'mech');
      else addLog(`[механика] ${m.action_type} | ${m.stat_key}+${m.skill}: ${m.total} vs DV${m.dv} -> ${m.success?'УСПЕХ':'ПРОВАЛ'}`, 'mech');
      if (m.damage != null) addLog(`цель ${m.target}: урон ${m.damage} - SP${m.armor_sp} = ${m.net_damage}`, 'mech');
      if (m.npc_reaction) {
        const nr = m.npc_reaction;
        addLog(`[ответ NPC] ${nr.npc}: ${nr.success?'попадание':'промах'}, урон по игроку ${nr.net_damage||0}`, 'mech');
      }
    }
    addLog(d.narration, 'narr');
  } catch (e) {
    document.getElementById('err').textContent = 'Ошибка: ' + e.message;
  } finally {
    document.getElementById('sendbtn').disabled = false;
  }
}

function addLog(text, cls) {
  const el = document.createElement('div');
  el.className = 'entry ' + cls;
  el.textContent = text;
  document.getElementById('log').appendChild(el);
  document.getElementById('log').scrollTop = document.getElementById('log').scrollHeight;
}
</script>
</body>
</html>
